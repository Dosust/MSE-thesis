<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc"><title id="title">V06 Resilience to Sustainability Diagnostic Interface</title><desc id="desc">V06 Resilience to Sustainability Diagnostic Interface thesis figure</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="20" width="1450" height="76" rx="12" fill="#173F6B"/><text x="55" y="69" font-family="Arial" font-size="34" font-weight="bold" fill="white">V06 — Resilience-to-Sustainability Transformation Interface</text><text x="55" y="125" font-family="Arial" font-size="22" fill="#5B6573">Stage 6 diagnoses adequacy of the current regime; it does not select interventions</text><rect x="80" y="220" width="380" height="430" rx="16" fill="#EAF2FB" stroke="#2E86DE" stroke-width="3"/><text x="270" y="268" font-family="Arial" font-size="23" font-weight="bold" fill="#2E86DE" text-anchor="middle">INPUT: Stage-5 evidence</text><rect x="560" y="220" width="380" height="430" rx="16" fill="#FFF4D8" stroke="#D99A2B" stroke-width="3"/><text x="750" y="268" font-family="Arial" font-size="23" font-weight="bold" fill="#D99A2B" text-anchor="middle">DIAGNOSIS</text><rect x="1040" y="220" width="380" height="430" rx="16" fill="#E9F6EF" stroke="#2E8B57" stroke-width="3"/><text x="1230" y="268" font-family="Arial" font-size="23" font-weight="bold" fill="#2E8B57" text-anchor="middle">OUTPUT</text><text x="115" y="315" font-family="Arial" font-size="20" font-weight="bold" fill="#243447">R₅ = {V, ρ, T_V, T_K,</text><text x="115" y="350" font-family="Arial" font-size="20" font-weight="bold" fill="#243447">S_V, S_K, Sᵛᵢⱼ}</text><text x="115" y="415" font-family="Arial" font-size="18" fill="#243447">+ long-horizon requirements Λ_LT</text><text x="115" y="480" font-family="Arial" font-size="18" font-weight="bold" fill="#5B6573">Question:</text><text x="115" y="515" font-family="Arial" font-size="18" fill="#243447">Is recovery within the</text><text x="115" y="545" font-family="Arial" font-size="18" fill="#243447">current regime sufficient?</text><text x="595" y="300" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">d₆ = [d_V, d_limit, d_lock,</text><text x="595" y="330" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">d_mal, d_sus, d_eq, d_struct]</text><text x="595" y="390" font-family="Arial" font-size="18" fill="#243447">Adaptation limits:</text><text x="595" y="420" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">L_A ∈ {none, soft, hard}</text><text x="595" y="490" font-family="Arial" font-size="20" font-weight="bold" fill="#C23B3B">WHY change?</text><text x="595" y="525" font-family="Arial" font-size="20" font-weight="bold" fill="#D99A2B">WHAT must change?</text><text x="595" y="560" font-family="Arial" font-size="20" font-weight="bold" fill="#2E8B57">HOW DEEP?</text><text x="1075" y="305" font-family="Arial" font-size="21" font-weight="bold" fill="#243447">c₆ ∈ {R, A, T}</text><text x="1075" y="350" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">D₆ = required change set</text><text x="1075" y="395" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">ζ_T = transformation character</text><text x="1075" y="470" font-family="Arial" font-size="18" fill="#243447">Φ_ST : (R₅,Λ_LT,d₆)</text><text x="1075" y="500" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">→ (c₆,D₆,ζ_T)</text><text x="1075" y="565" font-family="Arial" font-size="18" font-weight="bold" fill="#C23B3B">No action sequencing or</text><text x="1075" y="595" font-family="Arial" font-size="18" font-weight="bold" fill="#C23B3B">optimization occurs here.</text><line x1="465" y1="435" x2="545" y2="435" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><line x1="945" y1="435" x2="1025" y2="435" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/></svg>