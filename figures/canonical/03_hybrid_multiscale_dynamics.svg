<rect x="1090" y="205" width="350" height="460" rx="14" fill="#F7F9FC" stroke="#5B6573" stroke-width="2"/><text x="1265" y="245" font-family="Arial" font-size="22" font-weight="bold" fill="#173F6B" text-anchor="middle">Canonical architecture</text><text x="1115" y="300" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">Ẏ_c = Fᵐ[Y_c,Y_d,Y(t−δ),h;G,H_t]</text><text x="1115" y="340" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">0 = Gᵐ[·]</text><text x="1115" y="380" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">Y_d(tₑ⁺) = Rₑ[·]</text><text x="1115" y="420" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">m(tₑ⁺) = Δ_m[·]</text><text x="1115" y="460" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">G(tₑ⁺) = Ψ[·]</text><text x="1115" y="525" font-family="Arial" font-size="18" fill="#243447">Different τ_P, τ_T, τ_I, τ_O</text><text x="1115" y="565" font-family="Arial" font-size="18" fill="#243447">δᵢⱼ = cause→effect lag</text><text x="1115" y="600" font-family="Arial" font-size="18" fill="#243447">τᵢⱼ = mechanism duration/rate</text><text x="1115" y="635" font-family="Arial" font-size="18" font-weight="bold" fill="#2E8B57">Output: trajectories for Stage 4/5</text></svg>