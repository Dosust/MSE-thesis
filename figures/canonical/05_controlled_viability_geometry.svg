<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">V05 Controlled Sustainable Viability Geometry</title><desc id="desc">V05 Controlled Sustainable Viability Geometry thesis figure</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="20" width="1450" height="76" rx="12" fill="#173F6B"/><text x="55" y="69" font-family="Arial" font-size="34" font-weight="bold" fill="white">V05 — Controlled Sustainable Viability Geometry</text><text x="55" y="125" font-family="Arial" font-size="22" fill="#5B6573">Stage 5: acceptability is not the same as maintainability</text><line x1="150" y1="700" x2="760" y2="700" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="700" x2="150" y2="190" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="710" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">x₁</text><text x="130" y="175" font-family="Arial" font-size="18" font-weight="bold" fill="#243447">x₂</text><ellipse cx="440" cy="455" rx="260" ry="190" fill="#FCEBEC" stroke="#C23B3B" stroke-width="3"/><ellipse cx="420" cy="475" rx="170" ry="125" fill="#E9F6EF" stroke="#2E8B57" stroke-width="3"/><text x="530" y="315" font-family="Arial" font-size="25" font-weight="bold" fill="#C23B3B">K_sus(t)</text><text x="430" y="470" font-family="Arial" font-size="24" font-weight="bold" fill="#2E8B57" text-anchor="middle">V_sus^{u,T}</text><circle cx="365" cy="520" r="8" fill="#173F6B"/><text x="350" y="550" font-family="Arial" font-size="18" font-weight="bold" fill="#173F6B">Y(t)</text><line x1="373" y1="514" x2="505" y2="400" stroke="#173F6B" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="440" font-family="Arial" font-size="22" font-weight="bold" fill="#173F6B">ρ</text><rect x="860" y="205" width="540" height="470" rx="14" fill="#F7F9FC" stroke="#5B6573" stroke-width="2"/><text x="1130" y="245" font-family="Arial" font-size="24" font-weight="bold" fill="#173F6B" text-anchor="middle">Key quantities</text><text x="895" y="300" font-family="Arial" font-size="19" fill="#243447">K_sus(t): acceptable states</text><text x="895" y="345" font-family="Arial" font-size="19" fill="#243447">V_sus^{u,T}: states maintainable under admissible u(·)</text><text x="895" y="390" font-family="Arial" font-size="19" fill="#243447">ρ: distance/margin to ∂V</text><text x="895" y="435" font-family="Arial" font-size="19" fill="#243447">T_V: time to loss of maintainability</text><text x="895" y="480" font-family="Arial" font-size="19" fill="#243447">T_K: time to actual acceptability violation</text><text x="895" y="540" font-family="Arial" font-size="19" font-weight="bold" fill="#C23B3B">Critical distinction:</text><text x="895" y="580" font-family="Arial" font-size="20" font-weight="bold" fill="#C23B3B">Y ∉ V does not imply Y ∉ K_sus</text><text x="895" y="625" font-family="Arial" font-size="19" font-weight="bold" fill="#5B6573">Typically T_V ≤ T_K</text></svg>