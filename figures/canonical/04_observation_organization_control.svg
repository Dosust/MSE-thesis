-size="17" font-weight="bold" fill="#243447">Estimator: (X̂,Σ_X)=E(y_[0,t],z_I)</text><text x="1015" y="643" font-family="Arial" font-size="17" font-weight="bold" fill="#243447">Policy: u=π(X̂,z_I,z_O)</text></svg>