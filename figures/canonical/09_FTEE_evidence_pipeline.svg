<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">V09 FTEE Evidence-to-Equation Pipeline</title><desc id="desc">V09 FTEE Evidence-to-Equation Pipeline thesis figure</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="25" y="20" width="1550" height="76" rx="12" fill="#173F6B"/><text x="55" y="69" font-family="Arial" font-size="34" font-weight="bold" fill="white">V09 — FTEE v2.0 Evidence-to-Equation Pipeline</text><text x="55" y="125" font-family="Arial" font-size="22" fill="#5B6573">De novo evidence discovery precedes extraction; the old 325-paper corpus is coverage audit only</text><rect x="35" y="245" width="207" height="210" rx="14" fill="white" stroke="#173F6B" stroke-width="3"/><text x="138" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#173F6B" text-anchor="middle">H₁–H₅</text><text x="138" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">mechanism concepts</text><line x1="244" y1="350" x2="254" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="256" y="245" width="207" height="210" rx="14" fill="white" stroke="#2E86DE" stroke-width="3"/><text x="359" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#2E86DE" text-anchor="middle">Fresh search</text><text x="359" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">Scopus + WoS +</text><text x="359" y="362" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">Compendex + IEEE</text><line x1="464" y1="350" x2="474" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="476" y="245" width="207" height="210" rx="14" fill="white" stroke="#0F8B8D" stroke-width="3"/><text x="579" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#0F8B8D" text-anchor="middle">Screening</text><text x="579" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">dedup → TA → full-text</text><text x="579" y="362" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">eligibility</text><line x1="685" y1="350" x2="695" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="697" y="245" width="207" height="210" rx="14" fill="white" stroke="#2E8B57" stroke-width="3"/><text x="800" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#2E8B57" text-anchor="middle">P_NEW eligible</text><text x="800" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">new primary evidence</text><text x="800" y="362" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">corpus</text><line x1="905" y1="350" x2="915" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="917" y="245" width="207" height="210" rx="14" fill="white" stroke="#7A4FB3" stroke-width="3"/><text x="1021" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#7A4FB3" text-anchor="middle">FTEE evidence units</text><text x="1021" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">eᵢⱼ = provenance +</text><text x="1021" y="362" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">mechanism + math + VVUQ</text><line x1="1126" y1="350" x2="1136" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="1138" y="245" width="207" height="210" rx="14" fill="white" stroke="#D99A2B" stroke-width="3"/><text x="1241" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#D99A2B" text-anchor="middle">Qualification</text><text x="1241" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">Q_E → Q_F</text><line x1="1346" y1="350" x2="1356" y2="350" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/><rect x="1358" y="245" width="207" height="210" rx="14" fill="white" stroke="#C23B3B" stroke-width="3"/><text x="1462" y="295" font-family="Arial" font-size="22" font-weight="bold" fill="#C23B3B" text-anchor="middle">M_required</text><text x="1462" y="340" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">mechanism/model</text><text x="1462" y="362" font-family="Arial" font-size="16" fill="#243447" text-anchor="middle">inventory</text><rect x="1010" y="535" width="500" height="120" rx="12" fill="#FFF4D8" stroke="#D99A2B" stroke-width="2"/><text x="1260" y="572" font-family="Arial" font-size="19" font-weight="bold" fill="#D99A2B" text-anchor="middle">Historical 325-paper corpus</text><text x="1260" y="607" font-family="Arial" font-size="17" fill="#243447" text-anchor="middle">used only after P_NEW is frozen</text><text x="1260" y="635" font-family="Arial" font-size="17" fill="#243447" text-anchor="middle">for secondary coverage diagnostics</text><line x1="930" y1="470" x2="1095" y2="535" stroke="#D99A2B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="55" y="690" font-family="Arial" font-size="19" font-weight="bold" fill="#C23B3B">Fresh-evidence rule: no paper enters because it is remembered, previously ranked, or belonged to an earlier corpus.</text></svg>