<line x1="444" y1="342" x2="596" y2="342" stroke="#0F8B8D" stroke-width="2"/><line x1="624" y1="342" x2="776" y2="342" stroke="#0F8B8D" stroke-width="2"/><line x1="804" y1="342" x2="956" y2="342" stroke="#0F8B8D" stroke-width="2"/>
