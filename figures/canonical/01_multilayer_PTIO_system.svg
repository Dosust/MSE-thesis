<rect x="1100" y="195" width="250" height="420" rx="14" fill="#F7F9FC" stroke="#5B6573" stroke-width="2"/>
<text x="1225" y="235" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#173F6B" text-anchor="middle" >Canonical object</text>
<text x="1225" y="285" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#243447" text-anchor="middle" >S = {P,T,I,O}</text>
<text x="1125" y="340" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243447">P,T = physical systems</text>
<text x="1125" y="385" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243447">I = informational layer</text>
<text x="1125" y="430" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243447">O = organizational layer</text>
<text x="1125" y="500" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5B6573">Solid: intra-layer</text>
<text x="1125" y="535" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5B6573">Dashed: cross-layer coupling</text>
<text x="1125" y="580" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5B6573">Topology may be state/mode dependent</text>
