<text x="55" y="125" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" fill="#5B6573" text-anchor="start" >Canonical ontology: P,T are physical infrastructure systems; I,O are informational and organizational layers</text>
