<rect x="455" y="205" width="490" height="220" rx="14" fill="#F7F9FC" stroke="#5B6573" stroke-width="2"/>
<text x="700" y="245" font-family="Arial" font-size="23" font-weight="bold" fill="#173F6B" text-anchor="middle">Canonical interdependency object</text>
<text x="700" y="295" font-family="Arial" font-size="24" font-weight="bold" fill="#243447" text-anchor="middle">Iᵅᵝᵢⱼ = (Eᵅᵢ, Eᵝⱼ, Mᵢⱼ, wᵢⱼ, δᵢⱼ, τᵢⱼ, aᵢⱼ, m, H_t)</text>
<text x="700" y="345" font-family="Arial" font-size="18" fill="#5B6573" text-anchor="middle">α → β is admissible only through an identified causal mechanism Mᵢⱼ</text>
<text x="700" y="385" font-family="Arial" font-size="19" font-weight="bold" fill="#C23B3B" text-anchor="middle">Common hazard exposure alone ≠ interdependency</text>
<text x="700" y="735" font-family="Arial" font-size="21" font-weight="bold" fill="#243447" text-anchor="middle">Complete directed scope: P↔T, P↔I, P↔O, T↔I, T↔O, I↔O</text>
