name: Deck3 v1.7 skill unification and nonregression

on:
  push:
    paths:
      - '.github/skills/**'
      - '.github/workflows/deck3-skill-unification.yml'
  pull_request:
    paths:
      - '.github/skills/**'
      - '.github/workflows/deck3-skill-unification.yml'
  workflow_dispatch:

jobs:
  unify-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deck3 v1.7 routing, v1.6 freeze and specialist contracts
        run: python -m unittest discover -s .github/skills/scientific-visual-orchestration/tests -p 'test_*.py' -v
      - name: Original mathematical-art numerical examples
        run: python -m unittest discover -s .github/skills/procedural-mathematical-art/tests -p 'test_*.py' -v
      - name: Existing Deck3 palette regression suite
        run: python -m unittest discover -s .github/skills/deck3/tests -p 'test_color_policy.py' -v
      - name: Existing repository-wide authored color audit
        run: python .github/skills/deck3/tests/audit_repo_colors.py
      - name: Baseline functional Deck3 runtime regression tests
        run: |
          python -m pip install --disable-pip-version-check python-pptx Pillow
          python -m unittest discover -s .github/skills/deck3/tests -p 'test_deck3.py' -v
