name: Phase 1 freeze resolved lockfile

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/phase1-freeze-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-lockfile:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_LOCK_SHA256: "68c37973b974af1fbf7214bf28a0a7473d4454f98a1678cf2fae703208d12fd4"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Resolve canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          bash project/phase1_runtime/resolve_lock.sh
          ACTUAL="$(sha256sum project/requirements-phase1-v1.lock.txt | cut -d' ' -f1)"
          echo "EXPECTED_LOCK_SHA256=${EXPECTED_LOCK_SHA256}"
          echo "ACTUAL_LOCK_SHA256=${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED_LOCK_SHA256}"

      - name: Commit exact resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/requirements-phase1-v1.lock.txt
          if git diff --cached --quiet; then
            echo "Canonical lockfile already committed; no change required."
            exit 0
          fi
          git commit -m "phase1: freeze canonical resolved dependency lockfile"
          git push origin HEAD:main
