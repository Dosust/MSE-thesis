name: DOE original Power-EV public data URL audit
on:
  push:
    branches: [doe-original-data-scraper-2026-11-03]
    paths:
      - '.github/workflows/doe-original-data-acquisition.yml'
      - '.github/skills/doe-power-ev-data-scraper/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Execute scraper regression tests
        run: python -m unittest discover -s .github/skills/doe-power-ev-data-scraper/tests -v
      - name: Resolve original links and download only public small files
        run: |
          python .github/skills/doe-power-ev-data-scraper/scripts/doe_scraper.py \
            --out doe_scraper_output --download-small --max-file-mb 5 --max-files 8 --max-api-calls 70
      - name: Inspect ORNL public API file-object formats
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          base='https://openenergyhub.ornl.gov/api/explore/v2.1/catalog/datasets'
          for slug in ('doe-ev-data-collection-charging-data','iowa-distribution-test-systems','energy-router-electric-vehicle-dataset'):
            for part in ('','/records?limit=2'):
              r=requests.get(base+'/'+slug+part,timeout=35)
              data=r.json()
              print('ORNL SHAPE',slug,part,r.status_code,'top',list(data) if isinstance(data,dict) else type(data),flush=True)
              if part:
                results=data.get('results',[]) if isinstance(data,dict) else []
                print('NUM',data.get('total_count'),len(results),flush=True)
                for x in results[:2]:
                  print('ITEM',json.dumps(x,ensure_ascii=False)[:5500],flush=True)
              else:
                ds=data.get('dataset',{}) if isinstance(data,dict) else {}
                print('METADATA',json.dumps(ds,ensure_ascii=False)[:2200],flush=True)
          PY
      - name: Display scientific qualification summary
        if: always()
        run: |
          if [ -f doe_scraper_output/run_summary.json ]; then cat doe_scraper_output/run_summary.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doe-power-ev-public-originals-and-link-audit
          path: doe_scraper_output/
          if-no-files-found: warn
          retention-days: 30
