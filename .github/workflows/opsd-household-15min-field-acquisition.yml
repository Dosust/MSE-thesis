name: OPSD original 15min co-located EV-grid field acquisition
on:
  push:
    branches: [fielddata-acquisition-live-2026-11-02]
    paths:
      - '.github/workflows/opsd-household-15min-field-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opsd-measured-electricity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Acquire authentic OPSD original and two co-located EV-grid sites
        shell: bash
        run: |
          python - <<'PY'
          import requests,csv,hashlib,json,os
          from pathlib import Path
          root=Path("opsd_15min_results");root.mkdir(exist_ok=True)
          urls=["https://data.open-power-system-data.org/household_data/2020-04-15/household_data_15min_singleindex.csv",
          "https://data.open-power-system-data.org/data/household_data/2020-04-15/household_data_15min_singleindex.csv"]
          raw=root/"household_data_15min_singleindex.csv";got=False;errors=[]
          for url in urls:
           try:
            print("Request:",url,flush=True)
            with requests.get(url,timeout=(15,150),stream=True,headers={"User-Agent":"Thesis-Field-Research/1.0"}) as resp:
             resp.raise_for_status();size=0
             with raw.open("wb") as f:
              for chunk in resp.iter_content(1024*1024):
               if chunk:
                size+=len(chunk)
                if size>110000000:raise RuntimeError("Exceeded declared 110MB transfer bound")
                f.write(chunk)
            if size<10000000:raise RuntimeError("Suspiciously small response "+str(size))
            got=True;break
           except Exception as e:
            errors.append(str(e))
            if raw.exists():raw.unlink()
          if not got:
           (root/"download_error.json").write_text(json.dumps({"errors":errors},indent=2))
           raise RuntimeError("Official OPSD CSV download failed: "+repr(errors))
          print("OPSD raw downloaded bytes:",raw.stat().st_size,flush=True)
          sha=hashlib.sha256()
          with raw.open("rb") as f:
           for chunk in iter(lambda:f.read(1024*1024),b""):sha.update(chunk)
          sites=["DE_KN_industrial3","DE_KN_residential4"]
          counts={s:{"rows_with_any_site_data":0,"both_ev_grid_nonempty":0,"ev_interpolated":0,"grid_interpolated":0} for s in sites}
          output={};writers={}
          with raw.open(encoding="utf-8-sig",newline="") as f:
           reader=csv.DictReader(f);headers=reader.fieldnames or []
           required={"utc_timestamp","interpolated"}|{s+"_ev" for s in sites}|{s+"_grid_import" for s in sites}
           if not required.issubset(headers):raise RuntimeError("Required columns missing: "+repr(sorted(required-set(headers))))
           for s in sites:
            cols=[x for x in headers if x in ("utc_timestamp","cet_cest_timestamp","interpolated") or x.startswith(s+"_")]
            out=(root/(s+"_original_kWh_15min.csv")).open("w",encoding="utf8",newline="")
            output[s]=out;w=csv.DictWriter(out,fieldnames=["source_id","site"]+cols+["ev_interpolated","grid_import_interpolated","same_site_metered_EV_grid","connected_transformer_thermal_field_verified"])
            writers[s]=w;w.writeheader()
           try:
            total=0
            for row in reader:
             total+=1
             flagged=set(x.strip().lower() for x in (row.get("interpolated") or "").split(";") if x.strip())
             for s in sites:
              ev=s+"_ev";grid=s+"_grid_import"
              if not (row.get(ev) or row.get(grid)):continue
              eflag=int(ev.lower() in flagged);gflag=int(grid.lower() in flagged)
              d={"source_id":"OPSD_household_data_2020-04-15","site":s,**{x:row.get(x,"") for x in writers[s].fieldnames if x in row},"ev_interpolated":eflag,"grid_import_interpolated":gflag,"same_site_metered_EV_grid":True,"connected_transformer_thermal_field_verified":False}
              writers[s].writerow(d)
              counts[s]["rows_with_any_site_data"]+=1
              counts[s]["both_ev_grid_nonempty"]+=int(bool(row.get(ev) and row.get(grid)))
              counts[s]["ev_interpolated"]+=eflag;counts[s]["grid_interpolated"]+=gflag
           finally:
            for o in output.values():o.close()
          summary={"download_url":url,"original_sha256":sha.hexdigest(),"original_bytes":raw.stat().st_size,"original_rows":total,"source_columns":len(headers),"site_counts":counts,"source_data_policy":"Published 15min kWh values retained verbatim. Do not infer cumulative-versus-interval or derive kW without checking source semantics.","published_quality":"Source regularized with interpolated or filled intervals; per-signal interpolation flags retained","same_premises_electricity_EVs":True,"transformer_EVSE_thermal_connection_verified":False,"publication":"OPSD Household Data 2020-04-15","license":"CC BY International"}
          (root/"opsd_15min_acquisition_QA.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2),flush=True)
          PY
      - name: Retain downloaded original and evidence-qualified site CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsd-original-household-15min-2020-04-15
          path: opsd_15min_results/
          if-no-files-found: error
          retention-days: 30
