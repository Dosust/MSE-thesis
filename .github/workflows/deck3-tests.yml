name: Deck3 Scientific Slide Workflow Tests

on:
  push:
    paths:
      - '.github/skills/deck3/**'
      - '.github/skills/scientific-infographic-design/**'
      - '.github/skills/scientific-diagram-design/**'
      - '.github/skills/mathematical-visualization-design/**'
      - '.github/skills/engineering-framework-design/**'
      - '.github/skills/dossiya-writing/**'
      - '.github/skills/dossiya-research-expert/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/deck3-tests.yml'
  pull_request:
    paths:
      - '.github/skills/deck3/**'
      - '.github/skills/scientific-infographic-design/**'
      - '.github/skills/scientific-diagram-design/**'
      - '.github/skills/mathematical-visualization-design/**'
      - '.github/skills/engineering-framework-design/**'
      - '.github/skills/dossiya-writing/**'
      - '.github/skills/dossiya-research-expert/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/deck3-tests.yml'
  workflow_dispatch:

jobs:
  deck3-structure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Deck3 runtime
        run: python -m pip install --disable-pip-version-check python-pptx Pillow
      - name: Test manifest, text stage, figures gate and composition
        working-directory: .github/skills/deck3
        run: python -m unittest discover -s tests -v
      - name: Deck3 all-forms V2 synthetic science and scope-regression checks
        working-directory: .github/skills/deck3
        run: |
          python -m unittest discover -s tests -p 'test_all_forms_learning_v2.py' -v
          python -m py_compile examples/scientific_sanity_gates.py examples/deck3.py
      - name: Validate professional engineering references and explicit 10-slide route
        working-directory: .github/skills/deck3
        run: |
          python -m unittest discover -s tests -p 'test_professional_engineering_ten_slide_route.py' -v
          python -m py_compile examples/deck3.py
          test -s references/DECK3_PROFESSIONAL_ENGINEERING_VISUAL_REFERENCES_V1.md
          test -s references/DECK3_PRESENTATION_VARIANT_ROUTER_V1.md
      - name: Test Deck3 advanced graphics, animation and exact sRGB palette
        working-directory: .github/skills/deck3/advanced_powerpoint
        run: |
          python -m unittest discover -s tests -v
          python examples/geometry_and_manifest_qa.py examples/advanced_manifest_example.json
      - name: Deck3 cross-skill + authored color source regressions
        working-directory: .github/skills/deck3
        run: |
          python -m unittest discover -s tests -v
      - name: Render 3 deterministic SVG source examples for color preflight
        working-directory: .github/skills/scientific-infographic-design/examples
        run: |
          python figures.py --out /tmp/deck3_figure_qa
          find /tmp/deck3_figure_qa -name '*.svg' -print -exec python ../../deck3/examples/asset_color_qa.py '{}' \;
      - name: Audit mechanism-trace example (structure, not physical validation)
        working-directory: .github/skills/deck3
        run: |
          python examples/mechanism_trace_qa.py examples/mechanism_trace_example.json
      - name: Check object/arrows metadata regression tests
        working-directory: .github/skills/deck3
        run: |
          python -m unittest discover -s tests -p 'test_mechanism_trace.py' -v
      - name: Smoke-test Stage 1 on example manifest
        working-directory: .github/skills/deck3
        run: |
          python examples/deck3.py text --manifest examples/deck3_manifest_example.json --out build/example_text.pptx
          test -s build/example_text.pptx
      - name: Confirm design evidence and instructions are present
        shell: bash
        run: |
          test -s .github/skills/deck3/SKILL.md
          test -s .github/skills/deck3/references/WORKFLOW.md
          test -s .github/skills/deck3/examples/deck3.py
          test -s .github/skills/scientific-infographic-design/SKILL.md
          echo "PASS: files present; generated infographic assets require independent science review"
