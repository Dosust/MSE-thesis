name: Deck3 dominant geometry
on:
  pull_request:
    paths:
      - '.github/skills/deck3/**'
      - '.github/workflows/deck3-dominant-geometry.yml'
  push:
    branches: [main]
    paths:
      - '.github/skills/deck3/**'
      - '.github/workflows/deck3-dominant-geometry.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-pptx Pillow
      - run: python -m unittest discover -s .github/skills/deck3/tests -v
