name: Canonical Visual Integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/integrate_canonical_visuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate canonical visuals
        run: python tools/integrate_canonical_visuals.py

      - name: Verify visual references
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = [
              '00_master_seven_stage_architecture.svg',
              '01_multilayer_PTIO_system.svg',
              '02_causal_interdependency_object.svg',
              '03_hybrid_multiscale_dynamics.svg',
              '04_observation_organization_control.svg',
              '05_controlled_viability_geometry.svg',
              '06_resilience_sustainability_interface.svg',
              '07_transformation_pathways.svg',
              '08_hypothesis_test_architecture.svg',
              '09_FTEE_evidence_pipeline.svg',
              '10_minimal_experimental_realization.svg',
          ]
          base = Path('figures/canonical')
          missing = [name for name in expected if not (base / name).exists()]
          if missing:
              raise SystemExit(f'Missing canonical SVGs: {missing}')
          print('All V00–V10 canonical SVG assets are present.')
          PY

      - name: Commit integration if changed
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "Dossiya-SE thesis visual integration"
          git config user.email "actions@github.com"
          git add README.md project figures/canonical/README.md
          git commit -m "Integrate canonical V00-V10 visuals into thesis documents"
          git push
