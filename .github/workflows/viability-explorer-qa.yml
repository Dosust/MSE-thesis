name: Viability Explorer QA

on:
  pull_request:
    branches: ["main"]
    paths:
      - "models/viability_explorer/**"
      - "tests/test_viability_explorer.py"
      - "tools/run_viability_explorer.py"
      - "visualization/infrastructure_viability_explorer/**"
      - ".github/workflows/viability-explorer-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "models/viability_explorer/**"
      - "tests/test_viability_explorer.py"
      - "tools/run_viability_explorer.py"
      - "visualization/infrastructure_viability_explorer/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused scientific regression tests
        run: python -m pytest -q tests/test_viability_explorer.py
      - name: Regenerate deterministic explorer data
        run: python tools/run_viability_explorer.py --output /tmp/demo-data.json
      - name: Verify committed data against regenerated model output
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          committed = json.loads(Path("visualization/infrastructure_viability_explorer/demo-data.json").read_text())
          regenerated = json.loads(Path("/tmp/demo-data.json").read_text())

          def compare(a, b, path="root"):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), f"key mismatch at {path}"
                  for key in a:
                      compare(a[key], b[key], f"{path}.{key}")
                  return
              if isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), f"length mismatch at {path}"
                  for i, (x, y) in enumerate(zip(a, b)):
                      compare(x, y, f"{path}[{i}]")
                  return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=1e-10, abs_tol=1e-10), (
                      f"numeric mismatch at {path}: {a} != {b}"
                  )
                  return
              assert a == b, f"value mismatch at {path}: {a!r} != {b!r}"

          compare(committed, regenerated)
          print("Committed explorer data match regenerated output within 1e-10 numeric tolerance.")
          PY
