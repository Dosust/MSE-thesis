name: Viability Explorer QA

on:
  pull_request:
    branches: ["main"]
    paths:
      - "models/viability_explorer/**"
      - "tests/test_viability_explorer.py"
      - "tools/run_viability_explorer.py"
      - "visualization/infrastructure_viability_explorer/**"
      - ".github/workflows/viability-explorer-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "models/viability_explorer/**"
      - "tests/test_viability_explorer.py"
      - "tools/run_viability_explorer.py"
      - "visualization/infrastructure_viability_explorer/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused scientific regression tests
        run: python -m pytest -q tests/test_viability_explorer.py
      - name: Regenerate deterministic explorer data
        run: python tools/run_viability_explorer.py --output /tmp/demo-data.json
      - name: Verify committed data are reproducible
        run: diff -u visualization/infrastructure_viability_explorer/demo-data.json /tmp/demo-data.json
