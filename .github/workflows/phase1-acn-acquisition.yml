name: Phase 1 authenticated ACN acquisition

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/phase1-acn-acquisition.yml"
      - "project/phase1_runtime/acquire_acn.py"
      - "project/phase1_runtime/process_acn.py"
      - "project/phase1_runtime/process_information.py"
      - "phase1_exec/acn_processing.py"
      - "phase1_exec/information_processing.py"
      - "project/PHASE1_ACN_PROCESSING_PROTOCOL_V1.md"
      - "project/PHASE1_INFORMATION_PROCESSING_PROTOCOL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_LOCK_SHA256: "68c37973b974af1fbf7214bf28a0a7473d4454f98a1678cf2fae703208d12fd4"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  acquire-frozen-acn-window:
    runs-on: ubuntu-24.04
    env:
      ACN_API_TOKEN: ${{ secrets.ACN_API_TOKEN }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Verify canonical lock and install
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum project/requirements-phase1-v1.lock.txt | cut -d' ' -f1)"
          echo "LOCK_SHA256=${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED_LOCK_SHA256}"
          python -m pip install --disable-pip-version-check "pip==24.0"
          python -m pip install --require-hashes -r project/requirements-phase1-v1.lock.txt

      - name: Execute synthetic ACN and information verification fixtures
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/phase1/test_acn_processing.py tests/phase1/test_information_processing.py \
            | tee phase1-preacn-fixtures.txt

      - name: Assert external credential is available without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACN_API_TOKEN:-}" ]; then
            echo "ACN_API_TOKEN is not configured in repository Actions secrets."
            echo "DATA_GATE=BLOCKED_EXTERNAL_CREDENTIAL"
            exit 86
          fi
          echo "ACN credential presence check: PASS"

      - name: Acquire immutable preregistered ACN raw object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-acn-evidence
          python project/phase1_runtime/acquire_acn.py | tee phase1-acn-evidence/acquisition-summary.txt

      - name: Freeze acquisition provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data/raw/acn_caltech_20191010_20191231_ts"
          test -f "${ROOT}/sessions_canonical.jsonl"
          test -f "${ROOT}/acquisition_manifest.json"
          RAW_SHA="$(sha256sum "${ROOT}/sessions_canonical.jsonl" | cut -d' ' -f1)"
          MANIFEST_SHA="$(sha256sum "${ROOT}/acquisition_manifest.json" | cut -d' ' -f1)"
          BYTES="$(wc -c < "${ROOT}/sessions_canonical.jsonl")"
          RECORDS="$(wc -l < "${ROOT}/sessions_canonical.jsonl")"
          CODE_SHA="$(git rev-parse HEAD)"
          ACQUIRED_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > phase1-acn-evidence/acquisition-identity.txt <<EOF
          CODE_SHA=${CODE_SHA}
          LOCK_SHA256=${EXPECTED_LOCK_SHA256}
          ACQUIRED_UTC=${ACQUIRED_UTC}
          RAW_FILE=${ROOT}/sessions_canonical.jsonl
          RAW_BYTES=${BYTES}
          RAW_RECORDS=${RECORDS}
          RAW_SHA256=${RAW_SHA}
          MANIFEST_SHA256=${MANIFEST_SHA}
          SITE=caltech
          START_LOCAL=2019-10-10T00:00:00-07:00
          END_LOCAL=2019-12-31T23:59:59-08:00
          TIMESERIES=true
          EOF
          cat phase1-acn-evidence/acquisition-identity.txt
          chmod -R a-w "${ROOT}"

      - name: Execute preregistered ACN raw-to-processed transformation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data/raw/acn_caltech_20191010_20191231_ts"
          PROC="phase1-acn-evidence/processed-acn"
          python project/phase1_runtime/process_acn.py \
            --raw-jsonl "${ROOT}/sessions_canonical.jsonl" \
            --out "${PROC}" \
            | tee phase1-acn-evidence/acn-processing-summary.txt
          sha256sum "${PROC}/processing_manifest.json" \
            | tee phase1-acn-evidence/acn-processing-manifest-sha256.txt

      - name: Execute preregistered information processing
        shell: bash
        run: |
          set -euo pipefail
          PROC="phase1-acn-evidence/processed-acn"
          INFO="phase1-acn-evidence/information"
          python project/phase1_runtime/process_information.py \
            --processed-acn "${PROC}" \
            --out "${INFO}" \
            | tee phase1-acn-evidence/information-processing-summary.txt
          sha256sum "${INFO}/information_manifest.json" \
            | tee phase1-acn-evidence/information-manifest-sha256.txt

      - name: Evaluate frozen ACN and information verification subgates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee phase1-acn-evidence/subgate-status.txt
          import json
          from pathlib import Path

          acn = json.loads(Path(
              "phase1-acn-evidence/processed-acn/processing_manifest.json"
          ).read_text())
          info = json.loads(Path(
              "phase1-acn-evidence/information/information_verification.json"
          ).read_text())

          vd06 = acn["energy_reconstruction"]["V_D06_state"]
          vi04 = info["V_I04_state"]
          print(f"V_D06={vd06}")
          print(f"V_I04={vi04}")
          if vd06 != "PASS":
              raise SystemExit("V-D06 did not satisfy the frozen <=1% median rule")
          if vi04 != "PASS":
              raise SystemExit("V-I04 did not satisfy seasonal-slot <= persistence RMSE")
          print("ACN_INFORMATION_SUBGATES=PASS")
          PY

      - name: Verify credential hygiene
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ACN_API_TOKEN:-}" ]; then
            if grep -R --binary-files=without-match -F "${ACN_API_TOKEN}" data phase1-acn-evidence 2>/dev/null; then
              echo "Credential material detected in generated evidence."
              exit 1
            fi
          fi
          echo "Generated evidence contains no literal ACN token."

      - name: Upload ACN acquisition and processing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-acn-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            data/raw/acn_caltech_20191010_20191231_ts/
            phase1-acn-evidence/
            phase1-preacn-fixtures.txt
