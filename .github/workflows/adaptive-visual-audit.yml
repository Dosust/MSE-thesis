name: Adaptive thesis visual audit

on:
  pull_request:
    paths:
      - "assets/math-art/master_architecture.svg"
      - "project/MATHEMATICAL_PRESENTATION_V3.md"
      - ".github/workflows/adaptive-visual-audit.yml"
  push:
    paths:
      - "assets/math-art/master_architecture.svg"
      - "project/MATHEMATICAL_PRESENTATION_V3.md"
      - ".github/workflows/adaptive-visual-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adaptive native mathematics
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('assets/math-art/master_architecture.svg')
          text = p.read_text(encoding='utf-8')
          root = ET.parse(p).getroot()
          local = lambda tag: tag.rsplit('}', 1)[-1]
          tags = [local(el.tag) for el in root.iter()]
          compact = ''.join(text.split())

          checks = {
              'root_is_svg': local(root.tag) == 'svg',
              'viewbox_stable': root.attrib.get('viewBox') == '0 0 1800 1050',
              'dark_media_query': 'prefers-color-scheme:dark' in compact,
              'accessible_title': 'title' in tags,
              'accessible_description': 'desc' in tags,
              'native_vector_no_image': 'image' not in tags,
              'no_raster_inversion': 'filter:invert' not in compact.lower(),
              'viability_symbol': 'VR' in text or 'V_R' in text,
              'recovery_symbol': 'CR' in text or 'C_R' in text,
              'p_w_t_sw': all(token in text for token in ['P','W','T','SW']),
              'falsification': 'P1…P7' in text or 'P1...P7' in text,
          }
          for name, ok in checks.items():
              print(f'{name}: {"PASS" if ok else "FAIL"}')
          failed = [name for name, ok in checks.items() if not ok]
          assert not failed, f'Adaptive thesis visual audit failed: {failed}'
          print('Adaptive thesis visual: PASS')
          PY
