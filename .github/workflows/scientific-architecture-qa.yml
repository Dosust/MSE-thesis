name: Scientific Architecture QA

on:
  push:
    paths:
      - "README.md"
      - "project/**"
      - "methods/architecture/**"
      - "config/**"
      - "schemas/**"
      - "assets/math-art/**"
      - "tests/test_viability_geometry.py"
      - ".github/workflows/scientific-architecture-qa.yml"
  pull_request:
    paths:
      - "README.md"
      - "project/**"
      - "methods/architecture/**"
      - "config/**"
      - "schemas/**"
      - "assets/math-art/**"
      - "tests/test_viability_geometry.py"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: python -m pip install --upgrade pip pytest pyyaml jsonschema

      - name: Python syntax check
        run: python -m py_compile methods/architecture/viability_geometry.py

      - name: Numerical smoke tests
        run: pytest -q tests/test_viability_geometry.py

      - name: Validate proposition registry
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = yaml.safe_load(Path('config/scientific_propositions.yaml').read_text())
          assert p['version'] == 1
          assert set(p['propositions']) == {f'P{i}' for i in range(1,8)}
          assert p['inference_rules']['prohibit_global_novelty_from_literature_rank'] is True
          print('Scientific proposition registry: PASS')
          PY

      - name: Validate JSON schema and example model
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/thesis_model.schema.json'))
          instance = json.load(open('config/example_model.json'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)
          print('Thesis model JSON schema: PASS')
          print('Example model instance: PASS')
          PY

      - name: Validate SVG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('assets/math-art').glob('*.svg'))
          assert len(files) >= 3
          for f in files:
              root = ET.parse(f).getroot()
              assert root.tag.endswith('svg')
              print(f'{f}: PASS')
          PY

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Julia coupled-model smoke test
        run: |
          julia --startup-file=no -e '
            include("methods/architecture/CoupledInfrastructure.jl");
            using .CoupledInfrastructure;
            p = ModelParameters();
            x = [0.9, 0.8, 0.7, 0.2];
            z = [0.10, 0.10, 0.08, 0.06];
            u = zeros(4);
            dx = zeros(4);
            dz = zeros(4);
            infrastructure_rhs!(dx, x, z, u, 0.5, p);
            interface_rhs!(dz, x, z, 0.5, p);
            @assert all(isfinite, dx);
            @assert all(isfinite, dz);
            @assert realized_flood_hazard(0.5, x[4], p) >= 0;
            println("Julia coupled-model scaffold: PASS");
          '
