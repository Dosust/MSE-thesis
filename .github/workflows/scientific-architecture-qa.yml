name: Scientific Architecture QA

on:
  push:
    paths:
      - "README.md"
      - "PROJECT_MEMORY.md"
      - "project/**"
      - "methods/**"
      - "figures/**"
      - "evidence/**"
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - "assets/math-art/**"
      - "tests/**"
      - ".github/workflows/scientific-architecture-qa.yml"
  pull_request:
    paths:
      - "README.md"
      - "PROJECT_MEMORY.md"
      - "project/**"
      - "methods/**"
      - "figures/**"
      - "evidence/**"
      - "config/**"
      - "schemas/**"
      - "tools/**"
      - "assets/math-art/**"
      - "tests/**"
      - ".github/workflows/scientific-architecture-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip pytest pyyaml jsonschema
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile methods/architecture/viability_geometry.py
          python -m py_compile methods/austin_case/admissibility.py
          python -m py_compile methods/austin_case/p3_execution_readiness.py
          python -m py_compile tools/thesis_display_lint.py
          python -m py_compile tools/normalize_github_math.py

      - name: Verify GitHub math normalization
        run: python tools/normalize_github_math.py --check

      - name: Mathematical display and ontology lint
        run: python tools/thesis_display_lint.py

      - name: Numerical geometry smoke tests
        run: pytest -q tests/test_viability_geometry.py

      - name: Austin case-study admissibility regression tests
        run: |
          pytest -q tests/test_austin_case_admissibility.py
          pytest -q tests/test_p3_austin_execution_readiness.py

      - name: Validate proposition and hypothesis registries
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          propositions = yaml.safe_load(Path('config/scientific_propositions.yaml').read_text())
          assert propositions['version'] == 3
          assert set(propositions['propositions']) == {f'P{i}' for i in range(1, 11)}
          assert propositions['inference_rules']['prohibit_global_novelty_from_literature_rank'] is True
          assert propositions['inference_rules']['framework_freeze_does_not_imply_empirical_validation'] is True

          hypotheses = yaml.safe_load(Path('config/research_hypotheses.yaml').read_text())
          assert hypotheses['version'] == 3
          assert hypotheses['source'] == 'project/CANONICAL_RQ_SO_HYPOTHESES_V4.md'
          assert set(hypotheses['hypotheses']) == {f'H{i}' for i in range(1, 6)}
          assert hypotheses['status']['hypothesis_logic_frozen'] is True
          assert hypotheses['status']['numerical_thresholds_frozen'] is False
          assert hypotheses['hypotheses']['H4']['name'] == 'intervention_consequences'
          assert hypotheses['hypotheses']['H5']['name'] == 'joint_engineering_decision'
          assert hypotheses['confirmatory_rules']['thresholds_must_be_defined_a_priori'] is True
          assert hypotheses['confirmatory_rules']['no_hypothesis_support_from_verification_only'] is True

          print('Scientific proposition registry: PASS')
          print('Primary hypothesis registry: PASS')
          PY

      - name: Validate canonical RQ-SO-H v4 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          mapping = json.loads(Path('config/research_question_mapping_v4.json').read_text())
          assert mapping['version'] == '4.0'
          assert mapping['rq_authority'] == 'project/CANONICAL_RESEARCH_QUESTIONS_V4.md'
          assert mapping['rq_so_h_authority'] == 'project/CANONICAL_RQ_SO_HYPOTHESES_V4.md'
          assert [q['id'] for q in mapping['questions']] == [f'RQ{i}' for i in range(1,8)]
          assert [q['objective_id'] for q in mapping['questions']] == [f'SO{i}' for i in range(1,8)]
          assert mapping['hypothesis_mapping'] == {
              'RQ1':'developmental_support_H1',
              'RQ2':'developmental_support_H1',
              'RQ3':'H1','RQ4':'H2','RQ5':'H3','RQ6':'H4','RQ7':'H5'
          }

          rq0 = ("How can coupled Power–Transportation infrastructure be represented as an interdependent "
                 "System of Systems and modeled as a spatiotemporal complex dynamical system to connect "
                 "qualified directional dependencies, observation- and organization-constrained feasible "
                 "response, uncertainty-aware service resilience, engineering intervention consequences, "
                 "and defensible engineering decisions?")
          assert mapping['overarching']['question'] == rq0

          active = [
              Path('project/CANONICAL_RESEARCH_QUESTIONS_V4.md'),
              Path('project/CANONICAL_RQ_SO_HYPOTHESES_V4.md'),
              Path('project/CANONICAL_CHAPTER_I_CONTENT_AND_FLOW_V3.md'),
              Path('thesis/01_introduction/CHAPTER_I_OFFICIAL_SOURCE_2026-09-20.md'),
          ]
          text = '\n'.join(p.read_text() for p in active)
          assert rq0 in text
          assert 'System-of-Systems Structure' in text
          assert 'Complex Spatiotemporal Coupled Dynamics' in text
          assert 'What sustainability requirements follow from resilience diagnosis' not in text
          assert 'What should be changed, where, when and in what sequence' not in text
          assert 'at least two resilience-effective engineering interventions produce materially different resource requirements' in text
          assert 'incorporating resource efficiency and admitted sustainability consequences together with feasibility and uncertainty' in text
          print('Canonical RQ–SO–H v4 contract: PASS')
          PY

      - name: Validate JSON schema and example model
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          with open('schemas/thesis_model.schema.json', encoding='utf-8') as f:
              schema = json.load(f)
          with open('config/example_model.json', encoding='utf-8') as f:
              instance = json.load(f)

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)
          assert instance['system']['physical_systems'] == ['power', 'transportation']
          assert instance['system']['layers'] == ['information', 'organization']
          print('Thesis model JSON schema: PASS')
          print('Canonical P-T-I-O example model: PASS')
          PY

      - name: Validate SVG assets when present
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('assets/math-art').glob('*.svg'))
          if not files:
              print('SVG_ASSET_CHECK=N/A_NO_ACTIVE_MATH_ART_SVGS')
          for f in files:
              root = ET.parse(f).getroot()
              assert root.tag.endswith('svg')
              print(f'{f}: PASS')
          PY

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Julia P-T-I-O scaffold smoke test
        run: |
          julia --startup-file=no -e '
            include("methods/architecture/CoupledInfrastructure.jl");
            using .CoupledInfrastructure;
            p = ModelParameters();
            x = [0.9, 0.8, 0.7, 0.6];
            u = zeros(4);
            dx = zeros(4);
            ptio_rhs!(dx, x, u, 0.5, p);
            @assert all(isfinite, dx);
            @assert LAYER_ORDER == (:P, :T, :I, :O);
            @assert 0.0 <= feasible_control_scale(0.7, 0.8) <= 1.0;
            @assert isfinite(interdependency_signal(0.9, 0.5, 1.0, 0.8));
            println("Julia P-T-I-O scaffold: PASS");
          '
