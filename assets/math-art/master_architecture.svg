<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Master Mathematical Architecture</title>
<desc id="desc">Observation to identification, dynamic coupling, admissibility, viability, recoverability, control, and design for coupled P-W-T-SW infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient>
  <linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/>
<g opacity="0.16" stroke="#93c5fd" fill="none">
  <path d="M0 120 C300 10 500 220 800 100 S1300 20 1600 140"/>
  <path d="M0 780 C260 650 520 850 800 720 S1320 660 1600 790"/>
  <path d="M80 0 C220 250 0 420 180 900"/>
  <path d="M1460 0 C1320 250 1560 430 1400 900"/>
</g>
<text x="800" y="64" text-anchor="middle" fill="#f8fafc" font-family="Georgia,serif" font-size="34" font-weight="700">Mathematical Physics of Sustainable Infrastructure Resilience</text>
<text x="800" y="104" text-anchor="middle" fill="#93c5fd" font-family="Arial,sans-serif" font-size="19">Observation → Identification → Dynamic Coupling → Admissibility → Viability → Recoverability → Control → Design</text>

<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(95 200)"><rect width="165" height="115" rx="18" fill="#0f2745" stroke="#38bdf8" stroke-width="2"/><text x="82" y="37" fill="#e0f2fe" font-size="18" font-weight="700">OBSERVATION</text><text x="82" y="68" fill="#7dd3fc" font-size="17">D_obs</text><text x="82" y="95" fill="#cbd5e1" font-size="13">sensors • records • hazards</text></g>
  <g transform="translate(305 200)"><rect width="190" height="115" rx="18" fill="#112b42" stroke="#22d3ee" stroke-width="2"/><text x="95" y="37" fill="#ecfeff" font-size="18" font-weight="700">IDENTIFICATION</text><text x="95" y="68" fill="#67e8f9" font-size="16">(Ĝ, θ̂, Σθ)</text><text x="95" y="95" fill="#cbd5e1" font-size="13">inverse problem + UQ</text></g>
  <g transform="translate(540 200)"><rect width="200" height="115" rx="18" fill="#14313e" stroke="#34d399" stroke-width="2"/><text x="100" y="35" fill="#ecfdf5" font-size="18" font-weight="700">DYNAMIC MODEL</text><text x="100" y="65" fill="#86efac" font-size="15">Ẋ = F(X,Z,m,u,η;θ)</text><text x="100" y="91" fill="#a7f3d0" font-size="15">εŻ = G(X,Z,m,η;θ)</text></g>
  <g transform="translate(785 200)"><rect width="200" height="115" rx="18" fill="#1c3340" stroke="#fbbf24" stroke-width="2"/><text x="100" y="34" fill="#fffbeb" font-size="18" font-weight="700">ADMISSIBILITY</text><text x="100" y="64" fill="#fde68a" font-size="15">K_R = K_phys ∩ K_service</text><text x="100" y="88" fill="#fde68a" font-size="15">∩ K_sus ∩ K_eq</text></g>
  <g transform="translate(1030 200)"><rect width="185" height="115" rx="18" fill="#292d47" stroke="#c084fc" stroke-width="2"/><text x="92" y="35" fill="#faf5ff" font-size="18" font-weight="700">VIABILITY</text><text x="92" y="68" fill="#d8b4fe" font-size="22">V_R</text><text x="92" y="95" fill="#ddd6fe" font-size="13">survival geometry</text></g>
  <g transform="translate(1260 200)"><rect width="190" height="115" rx="18" fill="#392843" stroke="#f472b6" stroke-width="2"/><text x="95" y="35" fill="#fdf2f8" font-size="18" font-weight="700">RECOVERY</text><text x="95" y="68" fill="#f9a8d4" font-size="21">C_R , τ_R</text><text x="95" y="95" fill="#fbcfe8" font-size="13">capture geometry</text></g>
</g>

<g stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)" fill="none" filter="url(#glow)">
  <path d="M260 258 H305"/><path d="M495 258 H540"/><path d="M740 258 H785"/><path d="M985 258 H1030"/><path d="M1215 258 H1260"/>
</g>

<!-- sector operator -->
<g transform="translate(190 410)" font-family="Arial,sans-serif">
  <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700">Coupled P–W–T–SW operator</text>
  <g transform="translate(0 35)">
    <circle cx="90" cy="90" r="50" fill="#082f49" stroke="#38bdf8" stroke-width="3"/><text x="90" y="97" text-anchor="middle" fill="#e0f2fe" font-size="22">P</text>
    <circle cx="290" cy="90" r="50" fill="#083344" stroke="#22d3ee" stroke-width="3"/><text x="290" y="97" text-anchor="middle" fill="#cffafe" font-size="22">W</text>
    <circle cx="90" cy="260" r="50" fill="#14532d" stroke="#4ade80" stroke-width="3"/><text x="90" y="267" text-anchor="middle" fill="#dcfce7" font-size="22">T</text>
    <circle cx="290" cy="260" r="50" fill="#3f3f46" stroke="#fbbf24" stroke-width="3"/><text x="290" y="267" text-anchor="middle" fill="#fef3c7" font-size="22">SW</text>
    <g stroke="#a5f3fc" stroke-width="2.4" marker-end="url(#arrow)" opacity="0.9"><path d="M140 90 H238"/><path d="M255 128 L128 223"/><path d="M290 140 V208"/><path d="M127 225 L257 127"/><path d="M140 260 H238"/></g>
    <path d="M290 310 C360 350 395 190 330 118" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="390" y="226" fill="#fda4af" font-size="13" transform="rotate(-90 390 226)">waste → drainage → flood feedback</text>
  </g>
</g>

<!-- geometric core -->
<g transform="translate(700 430)" font-family="Arial,sans-serif">
  <text x="230" y="0" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Geometric core</text>
  <path d="M35 110 C90 25 310 12 420 100 C500 165 445 340 300 360 C125 383 0 275 35 110 Z" fill="#451a5c" opacity="0.55" stroke="#e879f9" stroke-width="3"/>
  <path d="M100 130 C145 75 295 72 356 135 C408 188 370 284 270 302 C160 321 78 244 100 130 Z" fill="#312e81" opacity="0.8" stroke="#a78bfa" stroke-width="3"/>
  <path d="M160 150 C190 118 278 116 316 158 C347 193 320 248 255 258 C190 268 142 220 160 150 Z" fill="#0f766e" opacity="0.9" stroke="#5eead4" stroke-width="3"/>
  <text x="68" y="94" fill="#f5d0fe" font-size="17">K_R</text>
  <text x="118" y="142" fill="#ddd6fe" font-size="17">C_R</text>
  <text x="214" y="191" fill="#ccfbf1" font-size="18" font-weight="700">V_R</text>
  <path d="M20 330 C70 300 105 275 150 238" stroke="#fb7185" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="12" y="356" fill="#fecdd3" font-size="14">recovery trajectory</text>
  <text x="220" y="405" text-anchor="middle" fill="#e2e8f0" font-size="15">Scientific object: ∂V_R and its deformation</text>
</g>

<!-- control/design block -->
<g transform="translate(1210 475)" font-family="Arial,sans-serif" text-anchor="middle">
  <rect width="255" height="88" rx="18" fill="#123044" stroke="#60a5fa" stroke-width="2"/><text x="127" y="34" fill="#eff6ff" font-size="18" font-weight="700">CONTROL</text><text x="127" y="62" fill="#bfdbfe" font-size="15">u ∈ U_V(x)</text>
  <path d="M127 90 V142" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <rect y="150" width="255" height="88" rx="18" fill="#153b35" stroke="#4ade80" stroke-width="2"/><text x="127" y="184" fill="#f0fdf4" font-size="18" font-weight="700">DESIGN</text><text x="127" y="212" fill="#bbf7d0" font-size="15">d → V_R(d), C_R(d)</text>
  <path d="M127 240 V292" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/>
  <rect y="300" width="255" height="88" rx="18" fill="#3c2b16" stroke="#fbbf24" stroke-width="2"/><text x="127" y="334" fill="#fffbeb" font-size="18" font-weight="700">OPTIMIZATION</text><text x="127" y="362" fill="#fde68a" font-size="15">d* = arg min J(d)</text>
</g>

<g transform="translate(80 840)" font-family="Arial,sans-serif">
  <text fill="#7dd3fc" font-size="17" font-weight="700">Q1</text><text x="36" fill="#e2e8f0" font-size="16">What moves the viability boundary?</text>
  <text x="430" fill="#86efac" font-size="17" font-weight="700">Q2</text><text x="466" fill="#e2e8f0" font-size="16">How uncertain is that boundary?</text>
  <text x="880" fill="#fbbf24" font-size="17" font-weight="700">Q3</text><text x="916" fill="#e2e8f0" font-size="16">What interventions/designs move it favorably?</text>
</g>
</svg>
