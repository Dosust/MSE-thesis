<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="t d"><title id="t">Mathematical Physics of Sustainable Infrastructure Resilience</title><desc id="d">Advanced visual synthesis of observation, inverse identification, dynamic P-W-T-SW interfaces, admissibility, viability and recovery geometry, uncertainty, control and design.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050f1d"/><stop offset=".55" stop-color="#0c2037"/><stop offset="1" stop-color="#08111f"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#285271" stroke-opacity=".22"/></pattern></defs><rect width="1800" height="1050" rx="34" fill="url(#bg)"/><rect x="25" y="25" width="1750" height="1000" rx="28" fill="url(#grid)" stroke="#284f6e"/><g font-family="Inter,Segoe UI,Arial"><text x="900" y="70" text-anchor="middle" fill="#f3f9ff" font-size="35" font-weight="800">MATHEMATICAL PHYSICS OF SUSTAINABLE INFRASTRUCTURE RESILIENCE</text><text x="900" y="108" text-anchor="middle" fill="#9cc8e0" font-size="17">observation → identification → dynamic interfaces → admissibility → viability / recovery → control → design</text>
<g font-size="14" font-weight="700"><rect x="70" y="150" width="180" height="95" rx="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/><text x="160" y="188" text-anchor="middle" fill="#fff">OBSERVATION</text><text x="160" y="214" text-anchor="middle" fill="#bae6fd" font-size="12">Dobs · sensors · records</text><rect x="290" y="150" width="200" height="95" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="390" y="188" text-anchor="middle" fill="#fff">IDENTIFICATION</text><text x="390" y="214" text-anchor="middle" fill="#cffafe" font-size="12">(Ĝ, θ̂, Σθ)</text><rect x="530" y="150" width="220" height="95" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="640" y="188" text-anchor="middle" fill="#fff">DYNAMIC MODEL</text><text x="640" y="214" text-anchor="middle" fill="#bbf7d0" font-size="12">Ẋ=F(X,Z,m,u,η;θ)</text><rect x="790" y="150" width="220" height="95" rx="16" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="900" y="188" text-anchor="middle" fill="#fff">ADMISSIBILITY</text><text x="900" y="214" text-anchor="middle" fill="#fde68a" font-size="12">KR=Kphys∩Kservice∩Ksus∩Keq</text><rect x="1050" y="150" width="190" height="95" rx="16" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="1145" y="188" text-anchor="middle" fill="#fff">VIABILITY</text><text x="1145" y="214" text-anchor="middle" fill="#e9d5ff" font-size="12">VR · ∂VR</text><rect x="1280" y="150" width="190" height="95" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="1375" y="188" text-anchor="middle" fill="#fff">RECOVERY</text><text x="1375" y="214" text-anchor="middle" fill="#fecdd3" font-size="12">CR · τR(x)</text><rect x="1510" y="150" width="220" height="95" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="1620" y="188" text-anchor="middle" fill="#fff">CONTROL / DESIGN</text><text x="1620" y="214" text-anchor="middle" fill="#dce5ed" font-size="12">u* · d* · Pareto set</text></g><path d="M250 198H290M490 198H530M750 198H790M1010 198H1050M1240 198H1280M1470 198H1510" stroke="url(#flow)" stroke-width="4" marker-end="url(#a)" filter="url(#glow)"/>
<rect x="70" y="300" width="510" height="320" rx="22" fill="#0d2238" stroke="#2d6f98"/><text x="96" y="338" fill="#7dd3fc" font-size="21" font-weight="700">A · Dynamic P–W–T–SW interface operator</text><text x="96" y="375" fill="#e7f6ff" font-size="16">ẋᵢ=fᵢ(xᵢ)+Σⱼ gᵢⱼ(xᵢ,xⱼ,Gᵢⱼ(t))+Bᵢuᵢ+ξᵢ</text><text x="96" y="405" fill="#e7f6ff" font-size="16">ρᵢⱼ = τinterface,ij / τsystem</text><g transform="translate(130 455)"><circle cx="65" cy="55" r="34" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/><circle cx="250" cy="38" r="34" fill="#064e3b" stroke="#34d399" stroke-width="3"/><circle cx="100" cy="200" r="34" fill="#713f12" stroke="#fbbf24" stroke-width="3"/><circle cx="315" cy="190" r="34" fill="#3b0764" stroke="#c084fc" stroke-width="3"/><g fill="#fff" font-size="14" font-weight="700"><text x="65" y="60" text-anchor="middle">P</text><text x="250" y="43" text-anchor="middle">W</text><text x="100" y="205" text-anchor="middle">T</text><text x="315" y="195" text-anchor="middle">SW</text></g><path d="M99 55H214M218 70L127 172M132 200H279M278 160L273 70M90 87L285 168" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/><path d="M315 225C380 250 410 92 286 56" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="365" y="174" fill="#fda4af" font-size="11" transform="rotate(-90 365 174)">waste–drainage–flood feedback</text></g>
<rect x="625" y="300" width="510" height="320" rx="22" fill="#0d2238" stroke="#2d6f98"/><text x="651" y="338" fill="#7dd3fc" font-size="21" font-weight="700">B · Inverse problem + viability uncertainty</text><text x="651" y="375" fill="#e7f6ff" font-size="16">Dobs → p(G,θ,Z | Dobs) → p(VR | Dobs)</text><text x="651" y="405" fill="#e7f6ff" font-size="16">Einv = dH[V(θ*), V(θ̂)]</text><path d="M665 545 C710 460,770 575,830 485 S965 470,1095 540" fill="none" stroke="#38bdf8" stroke-width="4"/><path d="M665 558 C720 505,785 522,845 500 S970 505,1095 485" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6"/><g fill="#fde68a"><circle cx="710" cy="505" r="5"/><circle cx="770" cy="548" r="5"/><circle cx="840" cy="498" r="5"/><circle cx="920" cy="485" r="5"/><circle cx="1010" cy="505" r="5"/></g><ellipse cx="960" cy="525" rx="110" ry="58" fill="#c084fc" fill-opacity=".08" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 6"/><text x="660" y="590" fill="#9cc7df" font-size="12">observations · inferred trajectory · posterior/geometry envelope</text>
<rect x="1180" y="300" width="550" height="320" rx="22" fill="#0d2238" stroke="#2d6f98"/><text x="1206" y="338" fill="#7dd3fc" font-size="21" font-weight="700">C · Viability / recovery geometry</text><text x="1206" y="375" fill="#e7f6ff" font-size="16">VR={x₀∈KR: ∃u(·), x(t)∈KR ∀t}</text><text x="1206" y="405" fill="#e7f6ff" font-size="16">CR={x₀: ∃u(·),∃T, x(T)∈VR}</text><path d="M1225 480 C1285 410,1455 410,1535 475 C1625 550,1560 600,1430 595 C1290 590,1170 550,1225 480Z" fill="#7e22ce" fill-opacity=".13" stroke="#c084fc" stroke-width="3"/><path d="M1280 490 C1330 445,1450 450,1505 495 C1560 540,1518 568,1425 562 C1330 558,1240 538,1280 490Z" fill="#0f766e" fill-opacity=".2" stroke="#5eead4" stroke-width="3"/><path d="M1205 575 C1260 560,1290 535,1330 518" fill="none" stroke="#fb7185" stroke-width="4" marker-end="url(#a)"/><text x="1220" y="600" fill="#fda4af" font-size="12">recovery trajectory</text><text x="1440" y="490" fill="#ccfbf1" font-size="15" font-weight="700">VR</text><text x="1550" y="455" fill="#e9d5ff" font-size="14">CR</text>
<rect x="70" y="670" width="1660" height="270" rx="22" fill="#0a1f33" stroke="#355a76"/><text x="96" y="708" fill="#cbe3f3" font-size="21" font-weight="700">D · Control, sustainable-equitable design and falsification</text><g font-size="13" font-weight="700"><rect x="105" y="755" width="235" height="80" rx="14" fill="#0c4a6e" stroke="#38bdf8"/><text x="222" y="787" text-anchor="middle" fill="#fff">SERVICE CONSTRAINT</text><text x="222" y="810" text-anchor="middle" fill="#bae6fd" font-size="10">critical continuity</text><rect x="385" y="755" width="235" height="80" rx="14" fill="#064e3b" stroke="#34d399"/><text x="502" y="787" text-anchor="middle" fill="#fff">SUSTAINABILITY</text><text x="502" y="810" text-anchor="middle" fill="#bbf7d0" font-size="10">resource / carbon / limits</text><rect x="665" y="755" width="235" height="80" rx="14" fill="#3b0764" stroke="#c084fc"/><text x="782" y="787" text-anchor="middle" fill="#fff">EQUITY</text><text x="782" y="810" text-anchor="middle" fill="#e9d5ff" font-size="10">population/service constraints</text><rect x="945" y="755" width="235" height="80" rx="14" fill="#78350f" stroke="#fbbf24"/><text x="1062" y="787" text-anchor="middle" fill="#fff">CONTROL</text><text x="1062" y="810" text-anchor="middle" fill="#fde68a" font-size="10">u ∈ UV(x)</text><rect x="1225" y="755" width="235" height="80" rx="14" fill="#4c0519" stroke="#fb7185"/><text x="1342" y="787" text-anchor="middle" fill="#fff">DESIGN</text><text x="1342" y="810" text-anchor="middle" fill="#fecdd3" font-size="10">d → VR(d), CR(d)</text><rect x="1505" y="755" width="190" height="80" rx="14" fill="#1e293b" stroke="#94a3b8"/><text x="1600" y="787" text-anchor="middle" fill="#fff">FALSIFY</text><text x="1600" y="810" text-anchor="middle" fill="#dce5ed" font-size="10">P1…P7 tests</text></g><path d="M340 795H385M620 795H665M900 795H945M1180 795H1225M1460 795H1505" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/><text x="100" y="887" fill="#9bb4c8" font-size="14">Central research object: ∂VR and how dynamic interfaces, climate forcing, inference uncertainty and sustainable-equitable constraints deform that boundary.</text></g></svg>