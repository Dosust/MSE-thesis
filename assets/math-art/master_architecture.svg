<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc"><title id="title">Mathematical Physics of Sustainable Infrastructure Resilience</title><desc id="desc">Adaptive light and dark thesis architecture connecting observation, inverse identification, coupled P-W-T-SW dynamics, sustainable-equitable admissibility, viability, recovery, uncertainty, control and falsifiable propositions.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--grid:#e2e8f0;--obs:#0369a1;--state:#1d4ed8;--iface:#7e22ce;--haz:#b91c1c;--unc:#b45309;--viable:#047857;--rec:#0f766e;--dec:#a16207;--hyp:#be185d}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--grid:#28445f;--obs:#38bdf8;--state:#60a5fa;--iface:#c084fc;--haz:#fb7185;--unc:#fbbf24;--viable:#34d399;--rec:#5eead4;--dec:#facc15;--hyp:#f472b6}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}.state{stroke:var(--state);fill:none}.iface{stroke:var(--iface);fill:none}.haz{stroke:var(--haz);fill:none}.unc{stroke:var(--unc);fill:none}.viable{stroke:var(--viable);fill:none}.rec{stroke:var(--rec);fill:none}.dec{stroke:var(--dec);fill:none}.hyp{stroke:var(--hyp);fill:none;stroke-dasharray:8 6}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1800" height="1050" rx="32"/><g class="grid" opacity=".45"><path d="M0 105H1800M0 210H1800M0 315H1800M0 420H1800M0 525H1800M0 630H1800M0 735H1800M0 840H1800M0 945H1800"/><path d="M180 0V1050M360 0V1050M540 0V1050M720 0V1050M900 0V1050M1080 0V1050M1260 0V1050M1440 0V1050M1620 0V1050"/></g><text x="70" y="70" class="fg" font-size="36" font-weight="800">MATHEMATICAL PHYSICS OF SUSTAINABLE INFRASTRUCTURE RESILIENCE</text><text x="70" y="106" class="muted" font-size="17">observation → identification → dynamic interfaces → admissibility → viability / recovery → control / design</text>
<g transform="translate(65 145)" font-size="14" font-weight="700"><rect x="0" y="0" width="180" height="90" rx="14" fill="var(--obs)"/><text x="90" y="37" text-anchor="middle" fill="var(--bg)">OBSERVATION</text><text x="90" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">Dobs · sensors · records</text><path d="M180 45H220" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="0" width="205" height="90" rx="14" fill="var(--unc)"/><text x="332" y="37" text-anchor="middle" fill="var(--bg)">IDENTIFICATION</text><text x="332" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">(Ĝ, θ̂, Σθ)</text><path d="M435 45H475" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="485" y="0" width="225" height="90" rx="14" fill="var(--state)"/><text x="598" y="37" text-anchor="middle" fill="var(--bg)">DYNAMIC MODEL</text><text x="598" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">Ẋ=F(X,Z,m,u,η;θ)</text><path d="M710 45H750" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="0" width="245" height="90" rx="14" fill="var(--dec)"/><text x="882" y="37" text-anchor="middle" fill="var(--bg)">ADMISSIBILITY</text><text x="882" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">KR=Kphys∩Kservice∩Ksus∩Keq</text><path d="M1005 45H1045" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1055" y="0" width="190" height="90" rx="14" fill="var(--viable)"/><text x="1150" y="37" text-anchor="middle" fill="var(--bg)">VIABILITY</text><text x="1150" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">VR · ∂VR</text><path d="M1245 45H1285" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1295" y="0" width="190" height="90" rx="14" fill="var(--rec)"/><text x="1390" y="37" text-anchor="middle" fill="var(--bg)">RECOVERY</text><text x="1390" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">CR · τR(x)</text><path d="M1485 45H1525" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1535" y="0" width="180" height="90" rx="14" fill="var(--iface)"/><text x="1625" y="37" text-anchor="middle" fill="var(--bg)">CONTROL</text><text x="1625" y="62" text-anchor="middle" fill="var(--bg)" font-size="11">u* · d*</text></g>
<rect x="65" y="285" width="530" height="340" rx="20" class="panel"/><text x="92" y="325" class="fg" font-size="21" font-weight="700">A · Dynamic P–W–T–SW interfaces</text><text x="92" y="365" class="fg math" font-size="19">ẋᵢ=fᵢ(xᵢ)+Σⱼgᵢⱼ(xᵢ,xⱼ,Gᵢⱼ(t))+Bᵢuᵢ+ξᵢ</text><text x="92" y="397" class="fg math" font-size="19">ρᵢⱼ=τinterface,ij / τsystem</text><g transform="translate(135 445)"><circle cx="60" cy="50" r="30" fill="var(--state)"/><circle cx="250" cy="35" r="30" fill="var(--viable)"/><circle cx="95" cy="185" r="30" fill="var(--dec)"/><circle cx="315" cy="180" r="30" fill="var(--iface)"/><g fill="var(--bg)" font-size="14" font-weight="700"><text x="60" y="55" text-anchor="middle">P</text><text x="250" y="40" text-anchor="middle">W</text><text x="95" y="190" text-anchor="middle">T</text><text x="315" y="185" text-anchor="middle">SW</text></g><path d="M90 50L220 38M225 58L120 160M125 185L285 180M285 155L270 65M87 75L286 158" class="iface" stroke-width="3"/><path d="M315 214C390 240 420 78 285 52" class="haz" stroke-width="3" stroke-dasharray="8 6"/><text x="345" y="145" fill="var(--haz)" font-size="11" transform="rotate(-90 345 145)">waste–drainage–flood feedback</text></g>
<rect x="635" y="285" width="530" height="340" rx="20" class="panel"/><text x="662" y="325" class="fg" font-size="21" font-weight="700">B · Inverse problem + uncertainty</text><text x="662" y="365" class="fg math" font-size="19">Dobs → p(G,θ,Z | Dobs) → p(VR | Dobs)</text><text x="662" y="397" class="fg math" font-size="19">Einv=dH[V(θ*),V(θ̂)]</text><path d="M680 555C730 465 790 580 850 485S1020 475 1135 540" class="state" stroke-width="4"/><path d="M680 568C740 510 805 525 865 500S1030 510 1135 490" class="unc" stroke-width="3" stroke-dasharray="8 6"/><ellipse cx="1000" cy="525" rx="105" ry="55" fill="var(--iface)" fill-opacity=".08" stroke="var(--iface)" stroke-dasharray="7 6"/><text x="675" y="598" class="muted" font-size="12">observations · inferred trajectory · posterior / viability envelope</text>
<rect x="1205" y="285" width="530" height="340" rx="20" class="panel"/><text x="1232" y="325" class="fg" font-size="21" font-weight="700">C · Viability / recovery geometry</text><text x="1232" y="365" class="fg math" font-size="18">VR={x₀∈KR:∃u(·),x(t)∈KR ∀t}</text><text x="1232" y="397" class="fg math" font-size="18">CR={x₀:∃u(·),∃T,x(T)∈VR}</text><path d="M1245 485C1310 420 1480 410 1570 478C1660 548 1600 605 1460 600C1320 595 1185 555 1245 485Z" fill="var(--iface)" fill-opacity=".10" stroke="var(--iface)" stroke-width="3"/><path d="M1300 495C1350 448 1475 450 1535 500C1590 545 1540 570 1450 565C1350 560 1260 540 1300 495Z" fill="var(--viable)" fill-opacity=".15" stroke="var(--viable)" stroke-width="3"/><path d="M1230 585C1280 570 1320 540 1360 520" class="rec" stroke-width="4" marker-end="url(#a)"/><text x="1240" y="610" fill="var(--rec)" font-size="12">recovery trajectory</text><text x="1465" y="500" fill="var(--viable)" font-size="15" font-weight="700">VR</text><text x="1590" y="460" fill="var(--iface)" font-size="14">CR</text>
<rect x="65" y="670" width="1670" height="275" rx="20" class="panel"/><text x="92" y="710" class="fg" font-size="21" font-weight="700">D · Sustainable-equitable control, design and falsification</text><g transform="translate(95 755)" font-size="13" font-weight="700"><rect width="235" height="78" rx="13" fill="var(--obs)"/><text x="117" y="34" text-anchor="middle" fill="var(--bg)">SERVICE</text><text x="117" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">critical continuity</text><path d="M235 39H280" stroke="var(--muted)" marker-end="url(#a)"/><rect x="290" width="235" height="78" rx="13" fill="var(--viable)"/><text x="407" y="34" text-anchor="middle" fill="var(--bg)">SUSTAINABILITY</text><text x="407" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">resource / carbon / limits</text><path d="M525 39H570" stroke="var(--muted)" marker-end="url(#a)"/><rect x="580" width="235" height="78" rx="13" fill="var(--iface)"/><text x="697" y="34" text-anchor="middle" fill="var(--bg)">EQUITY</text><text x="697" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">population / service constraints</text><path d="M815 39H860" stroke="var(--muted)" marker-end="url(#a)"/><rect x="870" width="235" height="78" rx="13" fill="var(--dec)"/><text x="987" y="34" text-anchor="middle" fill="var(--bg)">CONTROL</text><text x="987" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">u∈UV(x)</text><path d="M1105 39H1150" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1160" width="235" height="78" rx="13" fill="var(--haz)"/><text x="1277" y="34" text-anchor="middle" fill="var(--bg)">DESIGN</text><text x="1277" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">d→VR(d),CR(d)</text><path d="M1395 39H1440" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1450" width="130" height="78" rx="13" fill="var(--hyp)"/><text x="1515" y="34" text-anchor="middle" fill="var(--bg)">FALSIFY</text><text x="1515" y="56" text-anchor="middle" fill="var(--bg)" font-size="10">P1…P7</text></g><text x="92" y="885" class="fg math" font-size="17">central object: ∂VR and how dynamic interfaces, climate forcing, inference uncertainty, sustainability and equity deform that boundary</text><text x="92" y="917" class="muted" font-size="13">Theme changes presentation only. It does not change equations, topology, state classification, set geometry, evidence status, or scientific conclusion.</text></svg>