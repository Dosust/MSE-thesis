<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Viability and Recovery Geometry</title>
<desc id="desc">Adaptive light and dark mathematical visual of admissible, recoverable, viable and nonrecoverable state regions with boundaries and trajectories.</desc>
<style>
:root{--bg:#ffffff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--grid:#e2e8f0;--admiss:#be185d;--capture:#7e22ce;--viable:#047857;--recovery:#0f766e;--haz:#b91c1c;--unc:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--grid:#28445f;--admiss:#f472b6;--capture:#c084fc;--viable:#34d399;--recovery:#5eead4;--haz:#fb7185;--unc:#fbbf24}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}.admiss{stroke:var(--admiss)}.capture{stroke:var(--capture)}.viable{stroke:var(--viable)}.recovery{stroke:var(--recovery)}.haz{stroke:var(--haz)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}
</style>
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--recovery)"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--haz)"/></marker></defs>
<rect class="bg" width="1400" height="850" rx="28"/><g class="grid" opacity=".32"><path d="M0 85H1400M0 170H1400M0 255H1400M0 340H1400M0 425H1400M0 510H1400M0 595H1400M0 680H1400M0 765H1400"/><path d="M140 0V850M280 0V850M420 0V850M560 0V850M700 0V850M840 0V850M980 0V850M1120 0V850M1260 0V850"/></g>
<text x="700" y="62" text-anchor="middle" class="fg" font-size="36" font-weight="800">VIABILITY ≠ RECOVERY</text><text x="700" y="100" text-anchor="middle" class="muted" font-size="19">admissibility, survival, recoverability and nonrecoverability are distinct mathematical states</text>
<g transform="translate(120 140)"><path d="M0 590H900" stroke="var(--border)" stroke-width="2"/><path d="M65 640V0" stroke="var(--border)" stroke-width="2"/><text x="905" y="616" class="muted" font-size="17">state coordinate x₁</text><text x="30" y="10" class="muted" font-size="17" transform="rotate(-90 30 10)">state coordinate x₂</text>
<path d="M95 145C175 35 575 12 760 115C900 195 865 480 610 535C350 590 90 470 65 290C53 220 65 185 95 145Z" fill="var(--admiss)" fill-opacity=".10" class="admiss" stroke-width="4"/><path d="M175 185C245 105 555 85 690 165C785 224 745 430 570 470C385 515 195 432 158 305C140 247 148 217 175 185Z" fill="var(--capture)" fill-opacity=".10" class="capture" stroke-width="4"/><path d="M275 230C330 180 530 175 605 230C660 271 627 368 520 398C405 430 290 380 260 302C247 269 255 247 275 230Z" fill="var(--viable)" fill-opacity=".13" class="viable" stroke-width="4"/>
<text x="720" y="135" fill="var(--admiss)" font-size="24" font-weight="700">K_R</text><text x="645" y="205" fill="var(--capture)" font-size="24" font-weight="700">C_R</text><text x="480" y="288" fill="var(--viable)" font-size="25" font-weight="700">V_R</text><text x="473" y="319" fill="var(--viable)" font-size="14">viable states</text><text x="633" y="380" fill="var(--capture)" font-size="14">recoverable but not viable</text><text x="760" y="455" fill="var(--admiss)" font-size="14">admissible but nonrecoverable</text>
<path d="M546 408L596 447" class="viable" fill="none" stroke-width="2"/><text x="605" y="455" fill="var(--viable)" font-size="16">∂V_R</text><path d="M690 165L765 145" class="capture" fill="none" stroke-width="2"/><text x="775" y="150" fill="var(--capture)" font-size="16">∂C_R</text>
<circle cx="145" cy="405" r="8" fill="var(--fg)"/><text x="118" y="438" class="fg" font-size="15">x₀</text><path d="M150 402C220 350 250 318 310 302C360 290 405 300 450 315" class="recovery" fill="none" stroke-width="3" marker-end="url(#r)"/><text x="205" y="338" fill="var(--recovery)" font-size="15">recovery trajectory</text><circle cx="835" cy="265" r="8" fill="var(--haz)"/><text x="848" y="270" fill="var(--haz)" font-size="15">x₁</text><path d="M830 273C780 320 760 375 790 425" class="haz" fill="none" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#h)"/><text x="755" y="360" fill="var(--haz)" font-size="14">no admissible recovery found</text></g>
<g transform="translate(1060 165)"><rect width="280" height="480" rx="20" class="panel"/><text x="140" y="45" text-anchor="middle" class="fg" font-size="19" font-weight="700">MATHEMATICAL OBJECTS</text><text x="24" y="100" fill="var(--viable)" class="math" font-size="21">V_R</text><text x="24" y="130" class="muted" font-size="14">states that can remain admissible</text><line x1="20" y1="155" x2="260" y2="155" stroke="var(--border)"/><text x="24" y="205" fill="var(--capture)" class="math" font-size="21">C_R</text><text x="24" y="235" class="muted" font-size="14">states that can reach V_R in finite time</text><line x1="20" y1="260" x2="260" y2="260" stroke="var(--border)"/><text x="24" y="310" fill="var(--unc)" class="math" font-size="21">τ_R(x₀)</text><text x="24" y="340" class="muted" font-size="14">minimum admissible recovery time</text><line x1="20" y1="365" x2="260" y2="365" stroke="var(--border)"/><text x="24" y="415" fill="var(--admiss)" class="math" font-size="21">K_R</text><text x="24" y="445" class="muted" font-size="14">physical ∩ service ∩ sustainability ∩ equity</text></g>
<text x="700" y="802" text-anchor="middle" class="muted" font-size="17">Scientific question: how do interfaces, uncertainty, hazards, sustainability and equity deform ∂V_R and ∂C_R? Theme changes presentation only.</text>
</svg>