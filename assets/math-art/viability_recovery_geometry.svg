<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Viability and Recovery Geometry</title>
<desc id="desc">Nested admissible, recoverable, and viable regions with trajectories and boundaries.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#17132d"/></linearGradient>
  <radialGradient id="v"><stop offset="0" stop-color="#5eead4" stop-opacity=".85"/><stop offset="1" stop-color="#0f766e" stop-opacity=".45"/></radialGradient>
  <radialGradient id="c"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#6d28d9" stop-opacity=".22"/></radialGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f8fafc"/></marker>
</defs>
<rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<text x="700" y="62" text-anchor="middle" fill="#f8fafc" font-family="Georgia,serif" font-size="36" font-weight="700">Viability ≠ Recovery</text>
<text x="700" y="100" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="19">Geometry of admissibility, survival, recoverability, and nonrecoverability</text>

<!-- axes -->
<g transform="translate(120 140)" font-family="Arial,sans-serif">
  <path d="M0 590 H900" stroke="#64748b" stroke-width="2"/><path d="M65 640 V0" stroke="#64748b" stroke-width="2"/>
  <text x="905" y="616" fill="#94a3b8" font-size="17">state coordinate x₁</text>
  <text x="30" y="10" fill="#94a3b8" font-size="17" transform="rotate(-90 30 10)">state coordinate x₂</text>

  <!-- admissible set -->
  <path d="M95 145 C175 35 575 12 760 115 C900 195 865 480 610 535 C350 590 90 470 65 290 C53 220 65 185 95 145 Z" fill="#3f1d4a" opacity=".48" stroke="#e879f9" stroke-width="4"/>
  <!-- capture set -->
  <path d="M175 185 C245 105 555 85 690 165 C785 224 745 430 570 470 C385 515 195 432 158 305 C140 247 148 217 175 185 Z" fill="url(#c)" stroke="#a78bfa" stroke-width="4"/>
  <!-- viability set -->
  <path d="M275 230 C330 180 530 175 605 230 C660 271 627 368 520 398 C405 430 290 380 260 302 C247 269 255 247 275 230 Z" fill="url(#v)" stroke="#5eead4" stroke-width="4"/>

  <text x="720" y="135" fill="#f5d0fe" font-size="24" font-weight="700">K_R</text>
  <text x="645" y="205" fill="#ddd6fe" font-size="24" font-weight="700">C_R</text>
  <text x="480" y="288" fill="#ccfbf1" font-size="25" font-weight="700">V_R</text>
  <text x="473" y="319" fill="#99f6e4" font-size="14">viable states</text>
  <text x="633" y="380" fill="#c4b5fd" font-size="14">recoverable but not viable</text>
  <text x="780" y="455" fill="#f0abfc" font-size="14">admissible but nonrecoverable</text>

  <!-- boundary labels -->
  <path d="M546 408 L596 447" stroke="#5eead4" stroke-width="2"/><text x="605" y="455" fill="#99f6e4" font-size="16">∂V_R</text>
  <path d="M690 165 L765 145" stroke="#a78bfa" stroke-width="2"/><text x="775" y="150" fill="#ddd6fe" font-size="16">∂C_R</text>

  <!-- trajectories -->
  <circle cx="145" cy="405" r="8" fill="#f8fafc"/><text x="118" y="438" fill="#f8fafc" font-size="15">x₀</text>
  <path d="M150 402 C220 350 250 318 310 302 C360 290 405 300 450 315" fill="none" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="205" y="338" fill="#e2e8f0" font-size="15">recovery trajectory</text>

  <circle cx="835" cy="265" r="8" fill="#fb7185"/><text x="848" y="270" fill="#fecdd3" font-size="15">x₁</text>
  <path d="M830 273 C780 320 760 375 790 425" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="795" y="360" fill="#fecdd3" font-size="14">no admissible recovery found</text>
</g>

<!-- formulas -->
<g transform="translate(1060 165)" font-family="Georgia,serif">
  <rect width="280" height="480" rx="20" fill="#0f172a" stroke="#475569"/>
  <text x="140" y="45" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="19" font-weight="700">MATHEMATICAL OBJECTS</text>
  <text x="24" y="100" fill="#99f6e4" font-size="21">V_R</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">states that can remain admissible</text>
  <line x1="20" y1="155" x2="260" y2="155" stroke="#334155"/>
  <text x="24" y="205" fill="#ddd6fe" font-size="21">C_R</text><text x="24" y="235" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">states that can reach V_R in finite time</text>
  <line x1="20" y1="260" x2="260" y2="260" stroke="#334155"/>
  <text x="24" y="310" fill="#fde68a" font-size="21">τ_R(x₀)</text><text x="24" y="340" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">minimum admissible recovery time</text>
  <line x1="20" y1="365" x2="260" y2="365" stroke="#334155"/>
  <text x="24" y="415" fill="#f0abfc" font-size="21">K_R</text><text x="24" y="445" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">physical ∩ service ∩ sustainability ∩ equity</text>
</g>

<text x="700" y="802" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Scientific question: how do interfaces, uncertainty, hazards, sustainability, and equity deform ∂V_R and ∂C_R?</text>
</svg>
