<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif}.t{font-family:Georgia,serif;font-weight:700}</style>
<text x="900" y="42" text-anchor="middle" class="t" font-size="26" fill="#10243E">SIX INTERACTING SCIENTIFIC CHAINS</text>
<text x="900" y="70" text-anchor="middle" font-size="14" fill="#334155">Literature-grounded mathematical/physical ontology for sustainable &amp; resilient infrastructure systems</text>
<rect x="130" y="90" width="1540" height="40" rx="10" fill="#F6F8FB" stroke="#94A3B8"/>
<text x="900" y="116" text-anchor="middle" font-size="12" fill="#334155">Mathematical engines cut across all chains: dynamics · networks · probability/UQ · inverse problems · optimization · control · viability · decision theory</text>
<rect x="90" y="155" width="1620" height="120" rx="16" fill="#EDF5FF" stroke="#1F65B5" stroke-width="2"/>
<text x="120" y="187" class="t" font-size="19" fill="#1F65B5">I. PHYSICAL SYSTEM</text>
<text x="120" y="210" font-size="13" font-style="italic" fill="#1F65B5">What is the system?</text>
<text x="120" y="240" font-size="12" fill="#172033">Physical Laws → Components → Topology → Interfaces/Interdependencies → States &amp; Flows → Dynamics</text>
<text x="120" y="260" font-size="12" fill="#172033">Cascades</text>
<rect x="90" y="305" width="1620" height="120" rx="16" fill="#EDFBFB" stroke="#15858E" stroke-width="2"/>
<text x="120" y="337" class="t" font-size="19" fill="#15858E">II. OBSERVATION &amp; INFERENCE</text>
<text x="120" y="360" font-size="13" font-style="italic" fill="#15858E">What do we know?</text>
<text x="120" y="390" font-size="12" fill="#172033">Measurement → Observability → Identification → Calibration → State Estimation → Data Assimilation</text>
<text x="120" y="410" font-size="12" fill="#172033">UQ → Prediction</text>
<rect x="90" y="455" width="1620" height="120" rx="16" fill="#FFF0EF" stroke="#C7372F" stroke-width="2"/>
<text x="120" y="487" class="t" font-size="19" fill="#C7372F">III. STRESS &amp; CONSEQUENCE</text>
<text x="120" y="510" font-size="13" font-style="italic" fill="#C7372F">What happens under stress?</text>
<text x="120" y="540" font-size="12" fill="#172033">Hazard → Exposure → Vulnerability → Fragility → Damage/Failure → Cascade → Functional Loss</text>
<text x="120" y="560" font-size="12" fill="#172033">Service Loss → Societal Consequence → Risk/Criticality</text>
<rect x="90" y="605" width="1620" height="120" rx="16" fill="#F6F0FF" stroke="#6E44AD" stroke-width="2"/>
<text x="120" y="637" class="t" font-size="19" fill="#6E44AD">IV. VIABILITY &amp; RESPONSE</text>
<text x="120" y="660" font-size="13" font-style="italic" fill="#6E44AD">Can the system survive and recover?</text>
<text x="120" y="690" font-size="12" fill="#172033">Preparedness/Robustness → Viability → Reachability → Critical-Service Continuity → Resilience Metrics</text>
<text x="120" y="710" font-size="12" fill="#172033">Recovery/Restoration → Resource Allocation → Adaptive Control</text>
<rect x="90" y="755" width="1620" height="120" rx="16" fill="#F0FAF2" stroke="#39854A" stroke-width="2"/>
<text x="120" y="787" class="t" font-size="19" fill="#39854A">V. ENGINEERING LIFECYCLE</text>
<text x="120" y="810" font-size="13" font-style="italic" fill="#39854A">What can engineers do?</text>
<text x="120" y="840" font-size="12" fill="#172033">Requirements → Design → Deploy → Commission → Operate → Monitor → Age → Maintain → Repair/Replace</text>
<text x="120" y="860" font-size="12" fill="#172033">Retrofit/Expand → Plan → Adapt → Transform → Circularize</text>
<rect x="90" y="905" width="1620" height="120" rx="16" fill="#FFF8E8" stroke="#B77A00" stroke-width="2"/>
<text x="120" y="937" class="t" font-size="19" fill="#B77A00">VI. SOCIETAL DECISION</text>
<text x="120" y="960" font-size="13" font-style="italic" fill="#B77A00">What should society choose?</text>
<text x="120" y="990" font-size="12" fill="#172033">Evaluate [Sustainability + Equity + Economics/Finance + Governance + Human Behaviour + Risk]</text>
<text x="120" y="1010" font-size="12" fill="#172033">Trade Off → Decide → Implement → Observe Outcomes → Learn/Update</text>
<text x="900" y="1080" text-anchor="middle" font-size="12" fill="#475569">Six interacting loops, not one giant causal arrow. Generic formulas require equation-level provenance before direct attribution.</text>
</svg>
