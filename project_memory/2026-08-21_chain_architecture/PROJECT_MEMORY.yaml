thesis:
  working_title: 'Mathematical Physics of Sustainable Infrastructure Resilience'
  precise_formulation: 'Equity-Constrained Viability of Coupled Power–Water–Transportation–Solid-Waste Systems with Dynamic Interfaces under Climate Stress'
  sectors: [power, water, transportation, solid_waste]
  primary_demonstrator: 'urban flooding with drainage-waste feedback'
  current_center: [dynamic_interface_identification, coupled_hybrid_multiscale_dynamics, sustainable_equitable_admissibility, viability_geometry, recovery_capture_geometry, admissible_control]
  central_geometric_object: 'boundary of V_R'

canonical_chain: [observations, interface_parameter_identification_and_uncertainty, coupled_dynamic_model, hazard_failure_service_mapping, sustainability_equity_admissibility, viability_geometry, recovery_capture_geometry, admissible_control, design_optimization_decision]

symbols:
  X: 'coupled P-W-T-SW state'
  Z: 'dynamic interface state'
  m: 'discrete operating/failure mode'
  u: 'control/intervention'
  xi: 'exogenous climate forcing'
  eta: 'realized local hazard'
  theta: 'uncertain model/interface parameters'
  Y: 'observations'
  K_R: 'physical + service + sustainability + equity admissible set'
  V_R: 'viability kernel'
  C_R: 'recovery/capture set'
  tau_R: 'minimum recovery-time map'
  d: 'design vector'

six_chains:
  I: {name: 'Physical System', question: 'What is the system and what governs it?', layers: [physical_laws, structure, interdependencies, interfaces, states_flows, dynamics, cascades], core_object: 'F / dynamic operator'}
  II: {name: 'Observation-Inference-Prediction', question: 'What do we know and how certain are we?', layers: [observe, observability, identify, estimate, assimilate, uncertainty_quantification, predict], core_object: 'p(X,theta,Z|D)'}
  III: {name: 'Hazard-Failure-Consequence', question: 'How does disturbance become damage, service loss and consequence?', layers: [hazard, exposure, vulnerability, damage, failure, cascade, functionality_loss, service_loss, consequence, risk], core_object: 'eta,m,S,L'}
  IV: {name: 'Resilience-Viability-Recovery-Control', question: 'Can the system remain acceptable or recover?', layers: [admissibility, viability, reachability, service_continuity, recoverability, recovery, control], core_object: 'V_R,C_R'}
  V: {name: 'Engineering Lifecycle', question: 'What can engineers change?', layers: [requirements, design, deploy, operate, monitor, maintain, restore, retrofit, adapt, circularize], core_object: 'u,d'}
  VI: {name: 'Sustainability-Evaluation-Decision', question: 'Which feasible option should be chosen?', layers: [needs, alternatives, evaluate, trade_off, decide, implement, learn, revise], core_object: 'J,Pareto_set,a_star'}

frameworks:
  type_I: {name: 'Theory-First', question: 'What is mathematically possible?', mapping: '(theta,eta) -> X(t) -> V_R -> C_R -> u -> d -> decision', image: 'assets/frameworks/type_i_theory_first_framework.webp'}
  type_II: {name: 'Digital Twin / Inference-to-Decision', question: 'What is happening, what will happen, and what should be done now?', mapping: 'D -> p(X,theta,Z|D) -> p(V_R) -> u_t -> adaptive design/decision', image: 'assets/frameworks/type_ii_digital_twin_framework.webp'}
  type_III: {name: 'Resilience-by-Design', question: 'What should be built so acceptable behavior remains possible?', mapping: 'd -> F_d -> V_R(d) -> C_R(d) -> d_star -> decision', image: 'assets/frameworks/type_iii_resilience_by_design_framework.webp'}
  current_mse_recommendation: 'Type-I-centered, Type-II upstream identification/UQ, limited Type-III downstream demonstration'

propositions:
  P1_H0: 'Dynamic interfaces materially alter viability/recovery geometry versus static coupling.'
  P2_H1: 'Interface identifiability controls reliability of inferred viability.'
  P3_H2: 'Interface/system timescale ratios govern static-coupling approximation validity.'
  H3: 'Viability-boundary deformation defines interface criticality differently from conventional topology/flow metrics.'
  P4_H4: 'Sustainability/equity constraints deform the viable region beyond technical constraints.'
  P5_H5: 'Recovery/capture geometry contains information not captured by viability alone.'
  P6_H6: 'Waste-drainage-flood feedback shifts P-W-T-SW resilience boundaries.'
  H7: 'Optional time-varying admissible regions / nonanticipative recovery extension.'
  P7_T1: 'Reduced models used for decisions must preserve or conservatively bound projected full-order viability geometry.'

